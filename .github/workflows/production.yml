name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transformer-layerscape-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Store production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  release-quality:
    name: Release quality (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download verified production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-dist-${{ github.sha }}
          path: dist

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Install browser runtime
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run release, responsive and accessibility checks
        run: npx playwright test e2e/release.spec.ts e2e/accessibility.spec.ts --project=${{ matrix.project }} --workers=1

      - name: Run Chromium performance budget
        if: matrix.project == 'desktop-chromium'
        run: npm run test:e2e:performance

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    needs:
      - verify
      - release-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tl.nianan.ggff.net/
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-dist-${{ github.sha }}
          path: dist

      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required secret ${variable} is not configured." >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Prepare remote deployment context
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash -s -- '$DEPLOY_USER'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          readonly deploy_user="$1"
          readonly app_root='/home/ubuntu/transformer-layerscape'
          readonly deploy_context="${app_root}/deploy-context"
          readonly service_container='transformer-layerscape-web-1'
          readonly runtime_base='transformer-layerscape:runtime-base'

          install -d -o "$deploy_user" -g "$deploy_user" "${deploy_context}/dist"

          if ! docker image inspect "$runtime_base" >/dev/null 2>&1; then
            current_image="$(docker inspect --format '{{.Image}}' "$service_container")"
            docker tag "$current_image" "$runtime_base"
          fi

          if [[ ! -f "${deploy_context}/dist/index.html" ]]; then
            docker cp "${service_container}:/usr/share/nginx/html/." "${deploy_context}/dist/"
          fi

          chown -R "${deploy_user}:${deploy_user}" "$deploy_context"
          REMOTE_SCRIPT

      - name: Synchronize production bundle
        shell: bash
        run: |
          set -euo pipefail
          rsync \
            --archive \
            --checksum \
            --compress \
            --delete \
            --human-readable \
            --itemize-changes \
            -e "ssh -i '$HOME/.ssh/deploy_key' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/transformer-layerscape/deploy-context/dist/"
          rsync \
            --archive \
            --compress \
            -e "ssh -i '$HOME/.ssh/deploy_key' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            Dockerfile.runtime nginx.conf compose.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/transformer-layerscape/deploy-context/"

      - name: Deploy verified commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash -s -- '$GITHUB_SHA'" \
            < scripts/deploy-production.sh

      - name: Verify public endpoint from production host
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 --max-time 20 https://tl.nianan.ggff.net/ > /dev/null"
