name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transformer-layerscape-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tl.nianan.ggff.net/
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required secret ${variable} is not configured." >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy verified commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash -s -- '$GITHUB_SHA'" < scripts/deploy-production.sh

      - name: Verify public endpoint
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            https://tl.nianan.ggff.net/ > /dev/null
