services:
  web:
    image: ${APP_IMAGE:-transformer-layerscape:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODEL_RESOURCE_BASE_URL: ${VITE_MODEL_RESOURCE_BASE_URL:-}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
